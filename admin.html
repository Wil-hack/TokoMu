<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Serabimu Kuliner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0908; --bg-2:#0f0e0c; --card:#161412; --card-2:#1c1a17;
    --champagne:#d4bc8a; --champagne-soft:#f0e0bf; --champagne-glow:rgba(212,188,138,.16);
    --text:#f5f1ea; --muted:#9a9186; --border:rgba(212,188,138,.14);
    --border-soft:rgba(255,255,255,.05); --danger:#c96b5a; --success:#7fb88a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse 50% 35% at 50% -10%,var(--champagne-glow),transparent 70%),
    radial-gradient(ellipse 35% 25% at 100% 100%,rgba(212,188,138,.05),transparent 70%);}

  header{position:sticky;top:0;z-index:100;background:rgba(10,9,8,.82);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:1px;
    background:linear-gradient(100deg,var(--champagne-soft),var(--champagne));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand span{display:block;font-family:'Inter';font-size:9px;letter-spacing:5px;color:var(--muted);
    -webkit-text-fill-color:var(--muted);margin-top:2px;text-transform:uppercase;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .badge-admin{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--champagne-soft);
    border:1px solid var(--border);padding:6px 14px;border-radius:999px;background:rgba(212,188,138,.06);}
  .header-actions a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.5px;transition:.3s;}
  .header-actions a:hover{color:var(--champagne-soft);}

  .layout{max-width:1180px;margin:0 auto;padding:32px 24px 60px;display:grid;
    grid-template-columns:1fr 340px;gap:28px;align-items:start;}
  .feed-col{display:flex;flex-direction:column;gap:24px;}

  .composer{background:linear-gradient(165deg,var(--card),var(--card-2));border:1px solid var(--border);
    border-radius:20px;padding:22px 24px;transition:border-color .35s; margin-bottom:24px;}
  .composer:focus-within{border-color:rgba(212,188,138,.4);}
  .composer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .composer-user{display:flex;align-items:center;gap:14px;}
  .composer-user .avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--champagne-soft),#8a6d3f);display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-weight:700;color:#0a0908;font-size:19px;}
  .composer-user .who{font-size:14px;font-weight:600;}
  .composer-user .who span{display:block;font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:.5px;}

  .composer textarea, .composer input[type="text"]{width:100%;background:var(--bg-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Inter';font-size:13.5px;outline:none;margin-bottom:10px;}
  .composer textarea{resize:none;min-height:70px;}

  .composer-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;}
  .btn-upload{display:inline-flex;align-items:center;gap:8px;background:var(--bg-2);
    border:1px solid var(--border-soft);color:var(--champagne-soft);border-radius:12px;
    padding:11px 18px;font-family:'Inter';font-weight:500;font-size:12.5px;letter-spacing:.5px;
    cursor:pointer;transition:.3s;}
  .btn-upload:hover{border-color:rgba(212,188,138,.45);background:rgba(212,188,138,.06);}

  .btn-publish{background:linear-gradient(100deg,var(--champagne),var(--champagne-soft));
    color:#0a0908;border:none;border-radius:12px;padding:11px 26px;font-family:'Inter';
    font-weight:600;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.3s;}

  .post{background:linear-gradient(165deg,var(--card),var(--card-2));border:1px solid var(--border-soft);
    border-radius:20px;overflow:hidden;transition:.4s;margin-bottom:20px;}
  .post-head{display:flex;align-items:center;gap:13px;padding:20px 22px 14px;}
  .post-head .avatar{width:42px;height:42px;font-size:17px;background:linear-gradient(135deg,var(--champagne-soft),#8a6d3f);
    border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a0908;font-weight:700;
    font-family:'Playfair Display',serif;flex-shrink:0;}
  .post-head .name{font-size:14.5px;font-weight:600;}
  .post-head .menu{margin-left:auto;display:flex;gap:6px;}
  .post-head .menu button{background:transparent;border:1px solid var(--border-soft);color:var(--muted);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:13px;transition:.25s;}
  .post-head .menu button.del:hover{border-color:rgba(201,107,90,.5);color:var(--danger);}

  .side-col{position:sticky;top:90px;display:flex;flex-direction:column;gap:20px;}
  .side-card{background:linear-gradient(165deg,var(--card),var(--card-2));border:1px solid var(--border);
    border-radius:18px;padding:20px 22px;}
  .side-card h3{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;margin-bottom:4px;}
  .side-card .sub{font-size:11.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:16px;}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(100deg,var(--champagne),var(--champagne-soft));color:#0a0908;
    padding:12px 26px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.5px;
    opacity:0;pointer-events:none;transition:.4s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="brand">Serabimu<span>Admin Panel</span></div>
  <div class="header-actions">
    <span class="badge-admin">● Mode Admin</span>
    <a href="index.html">Lihat Toko →</a>
  </div>
</header>

<div class="layout">
  <div class="feed-col">
    
    <!-- 1. FORM KELOLA KATALOG MENU -->
    <div class="composer">
      <div class="composer-head">
        <div class="composer-user">
          <div class="avatar">K</div>
          <div class="who"><span>Tambah Menu Katalog Baru</span><span>Akan tampil di bagian katalog depan</span></div>
        </div>
      </div>
      <input type="text" id="prodTitle" placeholder="Nama Menu (Contoh: Serabi Kuah Durian)">
      <textarea id="prodDesc" placeholder="Deskripsi Menu (Contoh: Serabi lembut ditambah parutan durian asli...)"></textarea>
      <input type="text" id="prodPrice" placeholder="Harga (Contoh: Rp 18.000)">
      
      <div class="composer-tools">
        <label class="btn-upload" for="prodFileInput">📷 Pilih Foto Menu</label>
        <input type="file" id="prodFileInput" accept="image/*" style="display:none;">
        <button class="btn-publish" id="saveProductBtn">Simpan Ke Katalog</button>
      </div>
    </div>

    <!-- DAFTAR KATALOG DARI FIRESTORE -->
    <h2 style="font-family:'Playfair Display'; font-size:20px;">Daftar Katalog Produk</h2>
    <div id="adminProductList" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px;"></div>

    <hr style="border:none; border-top:1px solid var(--border); margin:20px 0;">

    <!-- 2. FORM KABAR TOKO / FEED -->
    <div class="composer">
      <div class="composer-head">
        <div class="composer-user">
          <div class="avatar">S</div>
          <div class="who"><span>Buat Kabar Toko Baru</span><span>Posting ke Feed</span></div>
        </div>
      </div>
      <textarea id="caption" placeholder="Apa yang ingin Anda bagikan hari ini?"></textarea>
      <input type="text" id="locationInput" placeholder="📍 Lokasi (Contoh: Lapangan Nguling, Pasuruan)">

      <div class="composer-tools">
        <label class="btn-upload" for="fileInput">🖼️ Foto / Video Feed</label>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none;">
        <button class="btn-publish" id="publishBtn">Publikasikan Feed</button>
      </div>
    </div>

    <h2 style="font-family:'Playfair Display'; font-size:20px;">Postingan Feed Toko</h2>
    <div id="postList"></div>
  </div>

  <div class="side-col">
    <!-- Ringkasan -->
    <div class="side-card">
      <h3>Ringkasan</h3>
      <p class="sub">Statistik toko Anda</p>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--muted);">Total produk</span>
          <strong style="color:var(--champagne-soft);" id="statProducts">0</strong>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--muted);">Total kabar toko</span>
          <strong style="color:var(--champagne-soft);" id="statPosts">0</strong>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ Berhasil</div>

<script type="module">
  const CLOUDINARY_CLOUD_NAME = "ywxfumtm";
  const CLOUDINARY_UPLOAD_PRESET = "Serabimu";

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjvq2H7qos6xzA4ZbNdjAKb8LHdF3fjdA",
    authDomain: "serabimu-96990.firebaseapp.com",
    projectId: "serabimu-96990",
    storageBucket: "serabimu-96990.firebasestorage.app",
    messagingSenderId: "888492450453",
    appId: "1:888492450453:web:eacb698dfa8f483f78719c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const toast = document.getElementById('toast');
  const showToast = (msg) => {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  };

  async function uploadToCloudinary(file){
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
    if(!res.ok) throw new Error('Upload gagal');
    const data = await res.json();
    return { url: data.secure_url, type: file.type.startsWith('video/') ? 'video' : 'image' };
  }

  // ====== A. MANAGEMENT KATALOG PRODUK ======
  const saveProductBtn = document.getElementById('saveProductBtn');
  const prodFileInput = document.getElementById('prodFileInput');

  saveProductBtn.addEventListener('click', async () => {
    const title = document.getElementById('prodTitle').value.trim();
    const desc = document.getElementById('prodDesc').value.trim();
    const price = document.getElementById('prodPrice').value.trim();
    const file = prodFileInput.files[0];

    if(!title || !price) {
      alert("Nama menu & harga wajib diisi!");
      return;
    }

    saveProductBtn.disabled = true;
    saveProductBtn.textContent = "Menyimpan...";

    try {
      let imageUrl = "";
      if(file) {
        const uploaded = await uploadToCloudinary(file);
        imageUrl = uploaded.url;
      }

      await addDoc(collection(db, "products"), {
        title: title,
        description: desc,
        price: price,
        imageUrl: imageUrl,
        createdAt: serverTimestamp()
      });

      document.getElementById('prodTitle').value = '';
      document.getElementById('prodDesc').value = '';
      document.getElementById('prodPrice').value = '';
      prodFileInput.value = '';
      showToast("✅ Menu Katalog Disimpan!");
    } catch(err) {
      alert("Gagal: " + err.message);
    } finally {
      saveProductBtn.disabled = false;
      saveProductBtn.textContent = "Simpan Ke Katalog";
    }
  });

  const qProds = query(collection(db, "products"), orderBy("createdAt", "desc"));
  onSnapshot(qProds, (snap) => {
    const adminProductList = document.getElementById('adminProductList');
    document.getElementById('statProducts').textContent = snap.size;
    adminProductList.innerHTML = '';
    
    snap.forEach((docSnap) => {
      const p = docSnap.data();
      const div = document.createElement('div');
      div.className = 'side-card';
      div.style.padding = '12px';
      div.innerHTML = `
        <img src="${p.imageUrl || 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=900&q=80'}" style="width:100%; height:100px; object-fit:cover; border-radius:8px; margin-bottom:8px;">
        <div style="font-weight:600; font-size:13px;">${p.title}</div>
        <div style="color:var(--champagne-soft); font-size:12px;">${p.price}</div>
        <button class="del-prod" data-id="${docSnap.id}" style="background:var(--danger); border:none; color:#fff; width:100%; padding:6px; border-radius:6px; margin-top:8px; cursor:pointer; font-size:11px;">Hapus Menu</button>
      `;
      adminProductList.appendChild(div);
    });

    adminProductList.querySelectorAll('.del-prod').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(confirm('Hapus menu ini?')) {
          await deleteDoc(doc(db, "products", btn.dataset.id));
          showToast('Menu dihapus');
        }
      });
    });
  });

  // ====== B. MANAGEMENT FEED TOKO ======
  const publishBtn = document.getElementById('publishBtn');
  const fileInput = document.getElementById('fileInput');

  publishBtn.addEventListener('click', async () => {
    const caption = document.getElementById('caption').value.trim();
    const location = document.getElementById('locationInput').value.trim();
    const files = Array.from(fileInput.files);

    if(!caption && files.length === 0) return alert("Isi pesan atau pilih file foto!");

    publishBtn.disabled = true;
    publishBtn.textContent = "Posting...";

    try {
      let mediaUrls = [];
      for(const file of files) {
        const uploaded = await uploadToCloudinary(file);
        mediaUrls.push(uploaded);
      }

      await addDoc(collection(db, "posts"), {
        caption: caption,
        location: location,
        mediaUrls: mediaUrls,
        likes: 0,
        createdAt: serverTimestamp()
      });

      document.getElementById('caption').value = '';
      document.getElementById('locationInput').value = '';
      fileInput.value = '';
      showToast("✅ Feed Dipublikasikan!");
    } catch(err) {
      alert("Gagal: " + err.message);
    } finally {
      publishBtn.disabled = false;
      publishBtn.textContent = "Publikasikan Feed";
    }
  });

  const qPosts = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(qPosts, (snap) => {
    const postList = document.getElementById('postList');
    document.getElementById('statPosts').textContent = snap.size;
    postList.innerHTML = '';
    
    snap.forEach((docSnap) => {
      const d = docSnap.data();
      const div = document.createElement('div');
      div.className = 'post';
      div.innerHTML = `
        <div class="post-head">
          <div class="avatar">S</div>
          <div><div class="name">Serabimu</div></div>
          <div class="menu">
            <button class="del" data-id="${docSnap.id}">✕</button>
          </div>
        </div>
        <p style="padding:0 20px 12px; font-size:13px;">${d.caption || ''}</p>
      `;
      postList.appendChild(div);
    });

    postList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(confirm('Hapus postingan ini?')) {
          await deleteDoc(doc(db, "posts", btn.dataset.id));
          showToast('Feed dihapus');
        }
      });
    });
  });
</script>

</body>
</html>
