<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Serabimu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0908;--bg-2:#0f0e0c;--card:#161412;--card-2:#1c1a17;
    --champagne:#d4bc8a;--champagne-soft:#f0e0bf;--champagne-glow:rgba(212,188,138,.16);
    --text:#f5f1ea;--muted:#9a9186;--border:rgba(212,188,138,.14);
    --border-soft:rgba(255,255,255,.05);--danger:#c96b5a;--success:#7fb88a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse 50% 35% at 50% -10%,var(--champagne-glow),transparent 70%),
    radial-gradient(ellipse 35% 25% at 100% 100%,rgba(212,188,138,.05),transparent 70%);}

  header{position:sticky;top:0;z-index:100;background:rgba(10,9,8,.82);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:1px;
    background:linear-gradient(100deg,var(--champagne-soft),var(--champagne));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand span{display:block;font-family:'Inter';font-size:9px;letter-spacing:5px;color:var(--muted);
    -webkit-text-fill-color:var(--muted);margin-top:2px;text-transform:uppercase;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .badge-admin{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--champagne-soft);
    border:1px solid var(--border);padding:6px 14px;border-radius:999px;background:rgba(212,188,138,.06);}
  .header-actions a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.5px;transition:.3s;}
  .header-actions a:hover{color:var(--champagne-soft);}

  .layout{max-width:1180px;margin:0 auto;padding:32px 24px 60px;display:grid;
    grid-template-columns:1fr 340px;gap:28px;align-items:start;}
  .feed-col{display:flex;flex-direction:column;gap:24px;}

  .composer{background:linear-gradient(165deg,var(--card),var(--card-2));border:1px solid var(--border);
    border-radius:20px;padding:22px 24px;transition:border-color .35s;}
  .composer:focus-within{border-color:rgba(212,188,138,.4);}
  .composer-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .composer-head .avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--champagne-soft),#8a6d3f);display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-weight:700;color:#0a0908;font-size:19px;
    box-shadow:0 0 0 1px rgba(212,188,138,.35),0 0 18px -4px var(--champagne-glow);}
  .composer-head .who{font-size:14px;font-weight:600;}
  .composer-head .who span{display:block;font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:.5px;}

  .composer textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);
    font-family:'Inter';font-size:15px;font-weight:300;resize:none;min-height:70px;padding:6px 2px;}
  .composer textarea::placeholder{color:#5f5a52;}
  .composer-divider{height:1px;background:var(--border);margin:10px 0 16px;}

  .composer-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;}
  .btn-upload{display:inline-flex;align-items:center;gap:8px;background:var(--bg-2);
    border:1px solid var(--border-soft);color:var(--champagne-soft);border-radius:12px;
    padding:11px 18px;font-family:'Inter';font-weight:500;font-size:12.5px;letter-spacing:.5px;
    cursor:pointer;transition:.3s;}
  .btn-upload:hover{border-color:rgba(212,188,138,.45);background:rgba(212,188,138,.06);}
  #fileInput{display:none;}

  .btn-publish{background:linear-gradient(100deg,var(--champagne),var(--champagne-soft));
    color:#0a0908;border:none;border-radius:12px;padding:11px 26px;font-family:'Inter';
    font-weight:600;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.3s;}
  .btn-publish:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-publish:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .img-preview{margin-top:16px;border-radius:14px;overflow:hidden;border:1px solid var(--border);
    display:none;position:relative;}
  .img-preview img{width:100%;display:block;max-height:320px;object-fit:cover;}
  .img-preview .remove{position:absolute;top:10px;right:10px;background:rgba(10,9,8,.8);color:#fff;
    border:1px solid var(--border);width:30px;height:30px;border-radius:50%;cursor:pointer;
    font-size:14px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:.25s;}
  .img-preview .remove:hover{background:var(--danger);border-color:var(--danger);}

  .feed-title{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
  .feed-title h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;}
  .feed-title span{font-size:12px;color:var(--muted);letter-spacing:.5px;}

  .post{background:linear-gradient(165deg,var(--card),var(--card-2));border:1px solid var(--border-soft);
    border-radius:20px;overflow:hidden;transition:.4s;}
  .post:hover{border-color:rgba(212,188,138,.25);}
  .post-head{display:flex;align-items:center;gap:13px;padding:20px 22px 14px;}
  .post-head .avatar{width:42px;height:42px;font-size:17px;background:linear-gradient(135deg,var(--champagne-soft),#8a6d3f);
    border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a0908;font-weight:700;
    font-family:'Playfair Display',serif;flex-shrink:0;}
  .post-head .name{font-size:14.5px;font-weight:600;}
  .post-head .time{font-size:11.5px;color:var(--muted);letter-spacing:.4px;}
  .post-head .menu{margin-left:auto;display:flex;gap:6px;}
  .post-head .menu button{background:transparent;border:1px solid var(--border-soft);color:var(--muted);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:13px;transition:.25s;}
  .post-head .menu button:hover{border-color:rgba(212,188,138,.4);color:var(--champagne-soft);}
  .post-head .menu button.del:hover{border-color:rgba(201,107,90,.5);color:var(--danger);}
  .post .caption{padding:0 22px 16px;font-size:14.5px;font-weight:300;color:#e8e2d8;}
  .post .photo{width:100%;display:block;max-height:480px;object-fit:cover;
    border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}
  .post .post-stats{display:flex;gap:20px;padding:12px 22px;font-size:12px;color:var(--muted);letter-spacing:.5px;}
  .post .post-stats strong{color:var(--champagne-soft);font-weight:600;}

  .side-col{position:sticky;top:90px;display:flex;flex-direction:column;gap:20px;}
  .side-card{background:linear-gradient(165deg,var(--card),var(--card-2));border:1px solid var(--border);
    border-radius:18px;padding:20px 22px;}
  .side-card h3{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;margin-bottom:4px;}
  .side-card .sub{font-size:11.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:16px;}
  .comment-item{padding:12px 0;border-bottom:1px solid var(--border-soft);}
  .comment-item:last-child{border-bottom:none;padding-bottom:0;}
  .comment-item .c-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .comment-item .avatar{width:32px;height:32px;font-size:13px;border-radius:50%;
    background:linear-gradient(135deg,var(--champagne-soft),#8a6d3f);display:flex;align-items:center;
    justify-content:center;color:#0a0908;font-weight:700;font-family:'Playfair Display',serif;flex-shrink:0;}
  .comment-item .c-name{font-size:12.5px;font-weight:600;color:var(--champagne-soft);}
  .comment-item .c-time{font-size:10.5px;color:var(--muted);margin-left:auto;}
  .comment-item .c-text{font-size:13px;font-weight:300;color:#d8d2c8;line-height:1.5;}
  .comment-item .c-actions{display:flex;gap:8px;margin-top:8px;}
  .comment-item .c-actions button{background:transparent;border:1px solid var(--border-soft);color:var(--muted);
    font-size:11px;letter-spacing:.5px;padding:4px 12px;border-radius:999px;cursor:pointer;transition:.25s;}
  .comment-item .c-actions button:hover{border-color:rgba(212,188,138,.4);color:var(--champagne-soft);}
  .comment-item .c-actions button.del:hover{border-color:rgba(201,107,90,.5);color:var(--danger);}

  .empty-state{text-align:center;padding:30px 10px;color:var(--muted);font-size:12.5px;letter-spacing:.5px;}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(100deg,var(--champagne),var(--champagne-soft));color:#0a0908;
    padding:12px 26px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.5px;
    opacity:0;pointer-events:none;transition:.4s;z-index:200;box-shadow:0 10px 40px -10px rgba(212,188,138,.4);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:900px){.layout{grid-template-columns:1fr;}.side-col{position:static;}}
  @media(max-width:600px){header{padding:14px 18px;}.brand{font-size:20px;}.badge-admin{display:none;}
    .layout{padding:20px 16px 40px;}.composer{padding:18px;}.composer-tools{flex-direction:column;align-items:stretch;}
    .btn-publish{width:100%;}}
</style>
</head>
<body>

<header>
  <div class="brand">Serabimu<span>Admin Panel</span></div>
  <div class="header-actions">
    <span class="badge-admin">● Mode Admin</span>
    <a href="index.html">Lihat Toko →</a>
  </div>
</header>

<div class="layout">
  <div class="feed-col">
    <div class="composer">
      <div class="composer-head">
        <div class="avatar">S</div>
        <div class="who">Serabimu<span>Posting sebagai admin</span></div>
      </div>
      <textarea id="caption" placeholder="Apa yang ingin Anda bagikan hari ini?"></textarea>
      <div class="composer-divider"></div>
      <div class="composer-tools">
        <label class="btn-upload" for="fileInput">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
          </svg>
          Pilih Foto dari HP
        </label>
        <input type="file" id="fileInput" accept="image/*">
        <button class="btn-publish" id="publishBtn">Publikasikan</button>
      </div>
      <div class="img-preview" id="imgPreview">
        <img id="previewImg" src="" alt="Preview">
        <button class="remove" id="removeImg" title="Hapus foto">✕</button>
      </div>
    </div>

    <div class="feed-title">
      <h2>Postingan Anda</h2>
      <span id="postCount">0 postingan</span>
    </div>

    <div id="postList"></div>
  </div>

  <div class="side-col">
    <div class="side-card">
      <h3>Moderasi Komentar</h3>
      <p class="sub">Komentar terbaru dari pelanggan</p>
      <div id="commentList"><div class="empty-state">Memuat komentar...</div></div>
    </div>
    <div class="side-card">
      <h3>Ringkasan</h3>
      <p class="sub">Statistik toko Anda</p>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:8px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--muted);">Total postingan</span>
          <strong style="color:var(--champagne-soft);" id="statPosts">0</strong>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--muted);">Total komentar</span>
          <strong style="color:var(--champagne-soft);" id="statComments">0</strong>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ Berhasil</div>

<script type="module">
  // ====== 1. KONFIGURASI CLOUDINARY (GANTI) ======
  const CLOUDINARY_CLOUD_NAME = "GANTI_CLOUD_NAME";
  const CLOUDINARY_UPLOAD_PRESET = "GANTI_PRESET_UNSIGNED";

  // ====== 2. KONFIGURASI FIREBASE (GANTI) ======
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, deleteDoc, doc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "GANTI_API_KEY",
    authDomain: "GANTI.firebaseapp.com",
    projectId: "GANTI_PROJECT_ID",
    storageBucket: "GANTI.appspot.com",
    messagingSenderId: "GANTI_SENDER_ID",
    appId: "GANTI_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ====== 3. ELEMEN ======
  const fileInput = document.getElementById('fileInput');
  const imgPreview = document.getElementById('imgPreview');
  const previewImg = document.getElementById('previewImg');
  const removeImg = document.getElementById('removeImg');
  const publishBtn = document.getElementById('publishBtn');
  const captionEl = document.getElementById('caption');
  const postList = document.getElementById('postList');
  const commentList = document.getElementById('commentList');
  const toast = document.getElementById('toast');
  let selectedFile = null;

  // ====== 4. PILIH FOTO DARI HP ======
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 5 * 1024 * 1024){
      showToast('Ukuran foto maksimal 5 MB', true);
      return;
    }
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (ev) => {
      previewImg.src = ev.target.result;
      imgPreview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  removeImg.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    imgPreview.style.display = 'none';
    previewImg.src = '';
  });

  // ====== 5. UPLOAD KE CLOUDINARY ======
  async function uploadToCloudinary(file){
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: 'POST',
      body: formData
    });
    if(!res.ok) throw new Error('Upload ke Cloudinary gagal');
    const data = await res.json();
    return data.secure_url;
  }

  // ====== 6. PUBLIKASIKAN ======
  publishBtn.addEventListener('click', async () => {
    const caption = captionEl.value.trim();
    if(!caption && !selectedFile){
      showToast('Isi caption atau pilih foto dulu', true);
      return;
    }
    publishBtn.disabled = true;
    publishBtn.textContent = 'Mengunggah...';
    try{
      let imageUrl = "";
      if(selectedFile){
        imageUrl = await uploadToCloudinary(selectedFile);
      }
      await addDoc(collection(db, "posts"), {
        caption: caption,
        imageUrl: imageUrl,
        createdAt: serverTimestamp()
      });
      captionEl.value = '';
      removeImg.click();
      showToast('✅ Postingan berhasil dipublikasikan');
    } catch(err){
      showToast('❌ ' + err.message, true);
    } finally {
      publishBtn.disabled = false;
      publishBtn.textContent = 'Publikasikan';
    }
  });

  // ====== 7. TAMPILKAN POSTINGAN ======
  const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(postsQuery, (snap) => {
    postList.innerHTML = "";
    document.getElementById('postCount').textContent = snap.size + " postingan";
    document.getElementById('statPosts').textContent = snap.size;
    if(snap.empty){
      postList.innerHTML = '<div class="empty-state">Belum ada postingan. Mulai dengan membuat yang pertama.</div>';
      return;
    }
    snap.forEach((docSnap) => {
      const d = docSnap.data();
      const el = document.createElement('div');
      el.className = 'post';
      el.innerHTML = `
        <div class="post-head">
          <div class="avatar">S</div>
          <div>
            <div class="name">Serabimu</div>
            <div class="time">${timeAgo(d.createdAt)}</div>
          </div>
          <div class="menu">
            <button class="del" data-id="${docSnap.id}" title="Hapus">✕</button>
          </div>
        </div>
        <p class="caption">${d.caption || ''}</p>
        ${d.imageUrl ? `<img class="photo" src="${d.imageUrl}" alt="Postingan">` : ''}
      `;
      postList.appendChild(el);
    });
    // Hapus postingan
    postList.querySelectorAll('.menu .del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(confirm('Hapus postingan ini?')){
          await deleteDoc(doc(db, "posts", btn.dataset.id));
          showToast('Postingan dihapus');
        }
      });
    });
  });

  // ====== 8. MODERASI KOMENTAR ======
  const commentsQuery = query(collection(db, "comments"), orderBy("createdAt", "desc"));
  onSnapshot(commentsQuery, (snap) => {
    document.getElementById('statComments').textContent = snap.size;
    if(snap.empty){
      commentList.innerHTML = '<div class="empty-state">Belum ada komentar.</div>';
      return;
    }
    commentList.innerHTML = "";
    snap.forEach((c) => {
      const d = c.data();
      const div = document.createElement('div');
      div.className = 'comment-item';
      div.innerHTML = `
        <div class="c-top">
          <div class="avatar">${(d.name||'A')[0].toUpperCase()}</div>
          <span class="c-name">${d.name || 'Anonim'}</span>
          <span class="c-time">${timeAgo(d.createdAt)}</span>
        </div>
        <div class="c-text">${d.text}</div>
        <div class="c-actions">
          <button class="del" data-id="${c.id}">Hapus</button>
        </div>
      `;
      commentList.appendChild(div);
    });
    commentList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(confirm('Hapus komentar ini?')){
          await deleteDoc(doc(db, "comments", btn.dataset.id));
          showToast('Komentar dihapus');
        }
      });
    });
  });

  // ====== 9. UTILITAS ======
  function timeAgo(ts){
    if(!ts) return "baru saja";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const diff = Math.floor((Date.now() - d.getTime())/1000);
    if(diff < 60) return "baru saja";
    if(diff < 3600) return Math.floor(diff/60) + " menit lalu";
    if(diff < 86400) return Math.floor(diff/3600) + " jam lalu";
    return Math.floor(diff/86400) + " hari lalu";
  }

  function showToast(msg, isError){
    toast.textContent = msg;
    toast.style.background = isError
      ? 'linear-gradient(100deg,#c96b5a,#e08a7a)'
      : 'linear-gradient(100deg,var(--champagne),var(--champagne-soft))';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }
</script>

</body>
</html>
