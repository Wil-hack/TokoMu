<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serabimu — Toko Pilihan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --card:#141418; --card-2:#1b1b21;
    --gold:#d4af37; --gold-soft:#f0d98c;
    --text:#f5f5f7; --muted:#9a9aa5;
    --border:rgba(212,175,55,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}

  header{position:sticky;top:0;z-index:50;background:rgba(11,11,13,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Playfair Display',serif;font-size:24px;letter-spacing:.5px;background:linear-gradient(90deg,var(--gold-soft),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand span{display:block;font-family:'Inter';font-size:11px;letter-spacing:3px;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:2px;}
  nav a{color:var(--muted);text-decoration:none;margin-left:26px;font-size:14px;letter-spacing:.5px;transition:.3s;}
  nav a:hover{color:var(--gold-soft);}

  .hero{text-align:center;padding:80px 24px 50px;background:radial-gradient(circle at 50% 0%,rgba(212,175,55,.10),transparent 60%);}
  .hero h1{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,54px);font-weight:700;letter-spacing:1px;background:linear-gradient(180deg,#fff,var(--gold-soft));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);max-width:520px;margin:16px auto 0;font-weight:300;}
  .divider{width:70px;height:2px;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);}

  section{max-width:760px;margin:0 auto;padding:40px 24px;}
  .section-title{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:6px;}
  .section-sub{color:var(--muted);font-size:14px;margin-bottom:30px;}

  /* ===== FEED POST ===== */
  .feed{display:flex;flex-direction:column;gap:26px;}
  .post{background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:.35s;}
  .post:hover{border-color:rgba(212,175,55,.4);}
  .post-head{display:flex;align-items:center;gap:13px;padding:18px 22px 14px;}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8a6d1f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0b0b0d;font-size:16px;flex-shrink:0;}
  .post-head .name{font-weight:600;font-size:15px;}
  .post-head .time{font-size:12px;color:var(--muted);}
  .post .caption{padding:0 22px 16px;font-size:14.5px;font-weight:300;color:#e7e7ec;}
  .post .photo{width:100%;display:block;max-height:520px;object-fit:cover;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}

  /* ===== KOMENTAR ===== */
  .comments{padding:16px 22px 20px;border-top:1px solid var(--border);background:rgba(0,0,0,.18);}
  .comments h4{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;font-weight:500;}
  .comment{display:flex;gap:11px;margin-bottom:14px;}
  .comment .avatar{width:34px;height:34px;font-size:13px;}
  .comment .bubble{background:#0f0f13;border:1px solid var(--border);border-radius:12px;padding:10px 14px;flex:1;}
  .comment .bubble .cname{font-size:13px;font-weight:600;color:var(--gold-soft);}
  .comment .bubble .ctext{font-size:13.5px;font-weight:300;color:#dcdce2;margin-top:3px;}
  .comment .bubble .ctime{font-size:11px;color:var(--muted);margin-top:5px;}

  .comment-form{display:flex;gap:10px;margin-top:14px;}
  .comment-form input{flex:1;background:#0f0f13;border:1px solid var(--border);border-radius:999px;padding:11px 18px;color:var(--text);font-family:'Inter';font-size:13.5px;outline:none;transition:.3s;}
  .comment-form input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12);}
  .comment-form button{background:linear-gradient(90deg,var(--gold),var(--gold-soft));color:#0b0b0d;border:none;border-radius:999px;padding:0 22px;font-weight:600;font-size:13px;cursor:pointer;transition:.3s;}
  .comment-form button:hover{filter:brightness(1.12);}

  footer{text-align:center;padding:50px 24px 40px;border-top:1px solid var(--border);margin-top:40px;color:var(--muted);font-size:13px;}
  footer .brand{font-size:18px;margin-bottom:8px;}

  @media(max-width:600px){
    nav a{margin-left:14px;font-size:12.5px;}
    header{padding:14px 16px;}
    section{padding:30px 16px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">SERABIMU<span>TOKO PILIHAN</span></div>
  <nav>
    <a href="#feed">Feed</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<div class="hero">
  <h1>Serabimu</h1>
  <div class="divider"></div>
  <p>Keanggunan dalam setiap pilihan. Produk terkurasi, pelayanan tulus.</p>
</div>

<section id="feed">
  <h2 class="section-title">Kabar Toko</h2>
  <p class="section-sub">Update terbaru & testimoni pelanggan</p>

  <div class="feed" id="feedContainer">
    <!-- Postingan akan dimuat dari Firebase di sini -->
  </div>
</section>

<footer>
  <div class="brand">SERABIMU</div>
  <p>© 2026 Serabimu. Semua hak dilindungi.</p>
</footer>

<script type="module">
  // ====== GANTI DENGAN KONFIGURASI FIREBASE ANDA ======
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "GANTI_API_KEY",
    authDomain: "GANTI.firebaseapp.com",
    projectId: "GANTI_PROJECT_ID",
    storageBucket: "GANTI.appspot.com",
    messagingSenderId: "GANTI_SENDER_ID",
    appId: "GANTI_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const feedContainer = document.getElementById('feedContainer');

  // Muat postingan real-time
  const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(postsQuery, (snapshot) => {
    feedContainer.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const post = docSnap.data();
      const postId = docSnap.id;
      renderPost(postId, post);
      loadComments(postId);
    });
  });

  function timeAgo(ts){
    if(!ts) return "baru saja";
    const d = ts.toDate();
    const diff = Math.floor((Date.now() - d.getTime())/1000);
    if(diff < 60) return "baru saja";
    if(diff < 3600) return Math.floor(diff/60) + " menit lalu";
    if(diff < 86400) return Math.floor(diff/3600) + " jam lalu";
    return Math.floor(diff/86400) + " hari lalu";
  }

  function renderPost(postId, post){
    const el = document.createElement('div');
    el.className = 'post';
    el.innerHTML = `
      <div class="post-head">
        <div class="avatar">S</div>
        <div>
          <div class="name">Serabimu</div>
          <div class="time">${timeAgo(post.createdAt)}</div>
        </div>
      </div>
      <p class="caption">${post.caption || ''}</p>
      ${post.imageUrl ? `<img class="photo" src="${post.imageUrl}" alt="Postingan">` : ''}
      <div class="comments">
        <h4>Komentar</h4>
        <div class="comment-list" id="comments-${postId}"></div>
        <div class="comment-form">
          <input type="text" placeholder="Tulis komentar..." data-post="${postId}">
          <button data-post="${postId}">Kirim</button>
        </div>
      </div>
    `;
    feedContainer.appendChild(el);

    // Kirim komentar
    el.querySelector('.comment-form button').addEventListener('click', async () => {
      const input = el.querySelector('.comment-form input');
      const text = input.value.trim();
      if(!text) return;
      const name = prompt("Nama Anda:") || "Anonim";
      await addDoc(collection(db, "comments"), {
        postId: postId,
        name: name,
        text: text,
        createdAt: serverTimestamp()
      });
      input.value = "";
    });
  }

  function loadComments(postId){
    const q = query(collection(db, "comments"), orderBy("createdAt", "asc"));
    onSnapshot(q, (snap) => {
      const list = document.getElementById(`comments-${postId}`);
      if(!list) return;
      list.innerHTML = "";
      snap.forEach((c) => {
        const d = c.data();
        if(d.postId !== postId) return;
        const div = document.createElement('div');
        div.className = 'comment';
        div.innerHTML = `
          <div class="avatar">${(d.name||'A')[0].toUpperCase()}</div>
          <div class="bubble">
            <div class="cname">${d.name || 'Anonim'}</div>
            <div class="ctext">${d.text}</div>
            <div class="ctime">${timeAgo(d.createdAt)}</div>
          </div>
        `;
        list.appendChild(div);
      });
    });
  }
</script>

</body>
</html>
