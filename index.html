<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eksplorasi Tema — Serabimu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif;line-height:1.65;overflow-x:hidden;
    transition:background .5s, color .5s; -webkit-font-smoothing:antialiased;
  }

  /* ================= VARIABEL 6 TEMA ================= */
  
  /* 1. Noir Émeraude (Favorit Anda saat ini) */
  body[data-theme="noir"]{
    --bg:#0a0a0b; --bg-2:#0f0f12; --card:#141418; --card-2:#1a1a20;
    --accent:#1a6b4f; --accent-soft:#7fc9a8; --text:#f0f5f2; --muted:#8a9a92;
    --border:rgba(127,201,168,.15); --glow:rgba(26,107,79,.2);
    --font-title:'Playfair Display',serif;
  }
  
  /* 2. Midnight Sapphire (Biru Malam & Perak) */
  body[data-theme="sapphire"]{
    --bg:#0a1120; --bg-2:#0d1526; --card:#111a2e; --card-2:#15203a;
    --accent:#a8b8d8; --accent-soft:#e6ebf5; --text:#f5f8ff; --muted:#7f8aa8;
    --border:rgba(192,200,214,.15); --glow:rgba(168,184,216,.15);
    --font-title:'Playfair Display',serif;
  }
  
  /* 3. Rose Antique (Marun & Rose Gold) */
  body[data-theme="rose"]{
    --bg:#1a0d10; --bg-2:#211216; --card:#281418; --card-2:#2f181d;
    --accent:#c98b7a; --accent-soft:#e8b8a8; --text:#f5e6e0; --muted:#a88a82;
    --border:rgba(201,139,122,.2); --glow:rgba(201,139,122,.16);
    --font-title:'Playfair Display',serif;
  }
  
  /* 4. Onyx & Copper (Hitam & Tembaga) */
  body[data-theme="copper"]{
    --bg:#0c0c0e; --bg-2:#111114; --card:#16161a; --card-2:#1c1c22;
    --accent:#b87333; --accent-soft:#e8a860; --text:#f0e6dc; --muted:#9a8a7a;
    --border:rgba(184,115,51,.2); --glow:rgba(184,115,51,.16);
    --font-title:'Playfair Display',serif;
  }
  
  /* 5. Ivory Luxe (Krem Hangat & Emas) - Tema Terang */
  body[data-theme="ivory"]{
    --bg:#faf6ef; --bg-2:#f0e8db; --card:#ffffff; --card-2:#fdfbf7;
    --accent:#b8912f; --accent-soft:#8a6d1f; --text:#2e2418; --muted:#8a7a62;
    --border:rgba(184,145,47,.25); --glow:rgba(184,145,47,.1);
    --font-title:'Playfair Display',serif;
  }

  /* 6. Royal Purple (Ungu Mewah & Emas) */
  body[data-theme="purple"]{
    --bg:#0e0714; --bg-2:#140a1c; --card:#1a0d24; --card-2:#21102d;
    --accent:#a34fde; --accent-soft:#e2b8ff; --text:#f7ebff; --muted:#a38db8;
    --border:rgba(226,184,255,.15); --glow:rgba(163,79,222,.2);
    --font-title:'Cinzel',serif;
  }

  /* ================= LAYOUT DASAR ================= */
  body{background:var(--bg); color:var(--text);}
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 50% -10%, var(--glow), transparent 70%);
    transition:background .5s;
  }

  header{
    position:sticky;top:0;z-index:100;background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
    padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
    transition:background .5s, border-color .5s;
  }
  .brand{
    font-family:var(--font-title);font-size:24px;font-weight:700;letter-spacing:1px;
    background:linear-gradient(100deg,var(--accent-soft),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand span{display:block;font-family:'Inter';font-size:9px;letter-spacing:4px;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:2px;}
  
  /* Tombol Ganti Tema */
  .theme-switch{display:flex;gap:8px;}
  .theme-switch button{
    width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid var(--border);
    transition:.3s; background:transparent;
  }
  .theme-switch button:hover{transform:scale(1.15);}
  .theme-switch button.active{border-color:var(--accent-soft); box-shadow:0 0 0 3px var(--glow);}
  .theme-switch button[data-t="noir"]{background:linear-gradient(135deg,#0a0a0b 50%,#1a6b4f 50%);}
  .theme-switch button[data-t="sapphire"]{background:linear-gradient(135deg,#0a1120 50%,#a8b8d8 50%);}
  .theme-switch button[data-t="rose"]{background:linear-gradient(135deg,#1a0d10 50%,#c98b7a 50%);}
  .theme-switch button[data-t="copper"]{background:linear-gradient(135deg,#0c0c0e 50%,#b87333 50%);}
  .theme-switch button[data-t="ivory"]{background:linear-gradient(135deg,#faf6ef 50%,#b8912f 50%);}
  .theme-switch button[data-t="purple"]{background:linear-gradient(135deg,#0e0714 50%,#a34fde 50%);}

  .hero{text-align:center;padding:80px 24px 60px;}
  .hero h1{font-family:var(--font-title);font-size:clamp(36px,6vw,60px);font-weight:700;margin-bottom:16px;color:var(--text);}
  .hero p{color:var(--muted);max-width:400px;margin:0 auto;font-size:15px;}

  .feed-wrap{max-width:600px;margin:0 auto;padding:0 20px 60px;}
  .post{background:linear-gradient(165deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:24px;transition:.3s;}
  .post:hover{border-color:var(--accent-soft);}
  
  .post-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bg);font-size:16px;}
  .post-head .name{font-weight:600;font-size:14.5px;color:var(--text);}
  .post-head .time{font-size:12px;color:var(--muted);}
  
  .post .caption{padding:0 20px 16px;font-size:14.5px;color:var(--text);opacity:.9;}
  .post .photo{width:100%;display:block;max-height:400px;object-fit:cover;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  
  .comments{padding:16px 20px;background:color-mix(in srgb, var(--bg) 50%, transparent);}
  .c-head{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent-soft);margin-bottom:12px;}
  .comment{display:flex;gap:10px;margin-bottom:12px;}
  .comment .bubble{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;flex:1;}
  .comment .cname{font-size:12px;font-weight:600;color:var(--accent-soft);}
  .comment .ctext{font-size:13px;color:var(--text);opacity:.85;}
  
  .comment-form{display:flex;gap:8px;margin-top:16px;}
  .comment-form input{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:999px;padding:10px 16px;color:var(--text);outline:none;font-size:13px;}
  .comment-form input:focus{border-color:var(--accent-soft);}
  .comment-form button{background:linear-gradient(100deg,var(--accent),var(--accent-soft));color:var(--bg);border:none;border-radius:999px;padding:0 20px;font-weight:600;font-size:12px;cursor:pointer;}
</style>
</head>
<body data-theme="noir">

<header>
  <div class="brand">Serabimu<span>Pilih Tema</span></div>
  <div class="theme-switch">
    <button data-t="noir" class="active" title="Noir Émeraude"></button>
    <button data-t="sapphire" title="Midnight Sapphire"></button>
    <button data-t="rose" title="Rose Antique"></button>
    <button data-t="copper" title="Onyx & Copper"></button>
    <button data-t="ivory" title="Ivory Luxe"></button>
    <button data-t="purple" title="Royal Purple"></button>
  </div>
</header>

<div class="hero">
  <h1>Serabimu</h1>
  <p>Klik bulatan warna di pojok kanan atas untuk melihat perubahan desain secara langsung.</p>
</div>

<div class="feed-wrap">
  <div class="post">
    <div class="post-head">
      <div class="avatar">S</div>
      <div>
        <div class="name">Serabimu</div>
        <div class="time">Baru saja</div>
      </div>
    </div>
    <p class="caption">Contoh tampilan postingan toko. Perhatikan bagaimana warna font dan tombol berubah menyesuaikan tema.</p>
    <img class="photo" src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&q=80" alt="Foto">
    <div class="comments">
      <div class="c-head">Komentar</div>
      <div class="comment">
        <div class="avatar" style="width:32px;height:32px;font-size:12px;">B</div>
        <div class="bubble">
          <div class="cname">Budi</div>
          <div class="ctext">Tema mana yang paling cocok nih?</div>
        </div>
      </div>
      <div class="comment-form">
        <input type="text" placeholder="Tulis komentar...">
        <button>Kirim</button>
      </div>
    </div>
  </div>
</div>

<script>
  const buttons = document.querySelectorAll('.theme-switch button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      document.body.setAttribute('data-theme', btn.dataset.t);
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>
</body>
</html>
